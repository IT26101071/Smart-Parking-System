<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Active Tickets - Smart Parking</title>
  <!-- Favicon Emoji -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --main: #1e3a5f;     /* navy */
      --accent: #f4b400;   /* amber */
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
      url('/images/bg3.png') no-repeat center right fixed;
      background-size: cover;
      min-height: 100vh;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Navbar Links matching other pages */
    .nav-link-custom {
      color: #dbe4ee;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-link-custom:hover {
      color: var(--accent);
    }
    .nav-link-custom.active {
      color: var(--accent);
      font-weight: bold;
    }

    /* Glass Card matching other pages (pushed down properly) */
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 24px;
      color: #1e3a5f;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      margin-top: 100px;
    }

    /* Search input */
    .search-input {
      border-radius: 50rem;
      padding: 12px 20px;
      border: 1px solid #ced4da;
    }
    .search-input:focus {
      border-color: var(--main);
      box-shadow: 0 0 0 0.2rem rgba(30, 58, 95, 0.2);
    }

    .btn-search {
      background-color: #0d6efd;
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 50rem;
      padding: 0 25px;
      transition: all 0.2s;
    }
    .btn-search:hover {
      background-color: #0b5ed7;
      color: white;
    }

    /* Table Customization */
    /* Table Header with Gradient Color from Pic 2 */
    .table-custom th {
      background: linear-gradient(135deg, #0d6efd, #0dcaf0) !important; /* මෙන්න මේ gradient එක දෙන්න */
      color: #ffffff !important;
      font-weight: 600;
      padding: 14px 16px;
      border: none;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }
    }
    .tickets-table td {
      vertical-align: middle;
      color: #1e3a5f;
    }
    .badge-slot {
      background-color: var(--main);
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
    }

    /* Outline Back to Home Button (solid blue on hover) */
    .btn-back-home {
      background-color: transparent;
      color: #0d6efd;
      border: 2px solid #0d6efd;
      font-weight: 600;
      border-radius: 50rem;
      padding: 10px 30px;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s ease-in-out;
    }
    .btn-back-home:hover {
      background-color: #0d6efd;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
    }
  </style>
</head>
<body>

<!-- Top Navigation Bar -->
<div class="container-fluid py-3 px-4 border-bottom border-white border-opacity-10 mb-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
    <div class="d-flex align-items-center gap-2">
      <span class="fw-bold fs-5 text-white">Smart Parking Management System</span>
    </div>
    <div class="d-flex align-items-center gap-4">
      <a th:href="@{/}" class="nav-link-custom">🏠 Home</a>
      <a th:href="@{/park}" class="nav-link-custom">🚗 Park Vehicle</a>
      <a th:href="@{/exit}" class="nav-link-custom">🚪 Exit Vehicle</a>
      <a th:href="@{/tickets}" class="nav-link-custom active">🎫 Active Tickets</a>
      <a th:href="@{/slots}" class="nav-link-custom">📊 Sorted Slots</a>
    </div>
  </div>
</div>

<!-- Main Container -->
<div class="container py-4" style="max-width: 950px;">

  <!-- Glass Card Container encompassing the entire content -->
  <div class="glass-card p-4 p-md-5 mb-5">

    <!-- Header Section inside the Card -->
    <div class="text-center mb-4">
      <span class="fs-1">🎫</span>
      <h2 class="fw-bold mt-1" style="color: #1e3a5f;">Active Tickets</h2>
      <p class="text-muted small">View and manage your active parking tickets</p>
    </div>

    <!-- Search Form -->
    <form th:action="@{/tickets}" method="get" class="input-group mb-4 shadow-sm bg-light rounded-pill overflow-hidden p-1 border">
      <span class="input-group-text bg-transparent border-0 ps-3 text-muted">🔍</span>
      <input type="text" name="search" class="form-control border-0 shadow-none search-input bg-light"
             placeholder="Search by Ticket ID (e.g. T1)" th:value="${search}">
      <button class="btn btn-search rounded-pill" type="submit">Search</button>
    </form>

    <!-- Tickets Table (tickets තියෙනවා නම්) -->
    <div class="table-responsive rounded-3 overflow-hidden shadow-sm mb-4" th:unless="${#lists.isEmpty(tickets)}">
      <table class="table table-hover tickets-table mb-0">
        <thead class="table-custom">
        <tr>
          <th class="py-3 ps-3">Ticket ID</th>
          <th class="py-3">Plate</th>
          <th class="py-3">Owner</th>
          <th class="py-3">Slot</th>
          <th class="py-3">Entry time</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${tickets}">
          <td class="ps-3 fw-bold"><strong th:text="${t.ticketId}"></strong></td>
          <td class="fw-semibold" th:text="${t.vehicle.plateNumber}"></td>
          <td th:text="${t.vehicle.ownerName}"></td>
          <td><span class="badge-slot" th:text="${t.slot.slotId}"></span></td>
          <td th:text="${#temporals.format(t.entryTime, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
      </table>
    </div>

    <!-- Empty state (tickets නැත්නම්) -->
    <div class="text-center py-4 text-muted" th:if="${#lists.isEmpty(tickets)}">
      <h4 class="fw-bold text-dark fs-5">No active tickets found.</h4>
      <p class="small mb-0">You can park your vehicle and get a new ticket.</p>
    </div>

    <!-- Back to Home Button -->
    <div class="mt-4 text-center">
      <a th:href="@{/}" class="btn-back-home small">&larr; Back to Home</a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
