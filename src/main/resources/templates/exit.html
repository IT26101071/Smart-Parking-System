<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exit Vehicle - Smart Parking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
  <style>
    :root {
      --main: #1e3a5f;     /* Navy */
      --accent: #f4b400;   /* Amber */
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
      url('/images/exitbg.png') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Navbar Links */
    .nav-link-custom {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-link-custom:hover, .nav-link-custom.active {
      color: #f4b400;
    }

    /* White Glassmorphism Card */
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 24px;
      color: #1e3a5f;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      margin-top: 140px;
    }

    .btn-exit {
      background: linear-gradient(135deg, #dc3545, #b02a37);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      padding: 12px;
      transition: all 0.3s ease;
    }
    .btn-exit:hover {
      background: linear-gradient(135deg, #198754, #157347); /* Green hover */
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(25, 135, 84, 0.4);
    }

    /* Outline button style, turns solid blue on hover matching other pages */
    .btn-back-home {
      background-color: transparent;
      color: #0d6efd;
      border: 2px solid #0d6efd;
      font-weight: 600;
      border-radius: 50rem;
      padding: 10px 30px;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s ease-in-out;
    }
    .btn-back-home:hover {
      background-color: #0d6efd;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
    }
  </style>
</head>
<body>

<!-- Top Navigation Bar (Admin removed) -->
<div class="container-fluid py-3 px-4 border-bottom border-white border-opacity-10 mb-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
    <div class="d-flex align-items-center gap-2">
      <span class="fw-bold fs-5 text-white">Smart Parking Management System</span>
    </div>
    <div class="d-flex align-items-center gap-4">
      <a th:href="@{/}" class="nav-link-custom">🏠 Home</a>
      <a th:href="@{/park}" class="nav-link-custom">🚗 Park Vehicle</a>
      <a th:href="@{/exit}" class="nav-link-custom active">🚪 Exit Vehicle</a>
      <a th:href="@{/tickets}" class="nav-link-custom">🎫 Active Tickets</a>
      <a th:href="@{/slots}" class="nav-link-custom">📊 Sorted Slots</a>
    </div>
  </div>
</div>

<!-- Main Container -->
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <div class="glass-card p-4 p-md-5 text-center">

        <div class="mb-3">
          <span class="fs-1">🚪</span>
          <h3 class="fw-bold mt-2" style="color: #1e3a5f;">Exit a Vehicle</h3>
          <p class="text-muted small">Complete your parking session and calculate the parking fee.</p>
        </div>

        <!-- Alert Message -->
        <div class="alert alert-info py-2 small fw-semibold" th:if="${message}" th:text="${message}"></div>

        <!-- Exit Form -->
        <form th:action="@{/exit}" method="post" class="text-start mt-4">
          <div class="mb-4">
            <label class="form-label fw-bold small text-secondary">Ticket ID</label>
            <input type="text" name="ticketId" class="form-control form-control-lg fs-6 bg-light border-0 py-2 shadow-sm"
                   placeholder="Enter ticket ID (e.g. T1)" required>
          </div>

          <button type="submit" class="btn btn-exit w-100 shadow-sm">
            Exit &amp; Calculate Fee →
          </button>
        </form>

        <div class="mt-4 pt-2">
          <a th:href="@{/}" class="btn-back-home small">← Back to Home</a>
        </div>

      </div>

    </div>
  </div>
</div>

</body>
</html>
