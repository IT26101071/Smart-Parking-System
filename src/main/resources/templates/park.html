<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Park Vehicle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
    <style>
        :root {
            --main: #1e3a5f;     /* navy */
            --accent: #f4b400;   /* amber */
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
            url('/images/parking-bg.png') no-repeat center right fixed;
            background-size: cover;
            min-height: 100vh;
        }

        .bg-main { background-color: var(--main) !important; }

        .nav-link-custom {
            color: #dbe4ee;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-link-custom:hover {
            color: var(--accent);
        }
        .nav-link-custom.active {
            color: var(--accent);
            font-weight: bold;
        }

        .btn-main {
            background-color: var(--main);
            color: white;
            transition: background-color 0.2s ease-in-out;
        }
        .btn-main:hover {
            background-color: #198754 !important;
            color: white;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--main);
            box-shadow: 0 0 0 0.2rem rgba(30, 58, 95, 0.2);
        }
        h2 { color: var(--main); }

        .custom-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            max-width: 400px;
            margin-top: 165px;
        }

        /* Outline button style, turns solid blue on hover matching the reference image */
        .btn-back-home {
            background-color: transparent;
            color: #0d6efd;
            border: 2px solid #0d6efd;
            font-weight: 600;
            border-radius: 50rem;
            padding: 10px 30px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease-in-out;
        }
        .btn-back-home:hover {
            background-color: #0d6efd;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div class="container-fluid py-3 px-4 border-bottom border-white border-opacity-10 mb-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div class="d-flex align-items-center gap-2">
            <span class="fw-bold fs-5 text-white">Smart Parking Management System</span>
        </div>
        <div class="d-flex align-items-center gap-4">
            <a th:href="@{/}" class="nav-link-custom">🏠 Home</a>
            <a th:href="@{/park}" class="nav-link-custom active">🚗 Park Vehicle</a>
            <a th:href="@{/exit}" class="nav-link-custom">🚪 Exit Vehicle</a>
            <a th:href="@{/tickets}" class="nav-link-custom">🎫 Active Tickets</a>
            <a th:href="@{/slots}" class="nav-link-custom">📊 Sorted Slots</a>
        </div>
    </div>
</div>

<div class="container d-flex justify-content-center">

    <div class="card custom-card shadow-lg border-0 rounded-4 p-4 w-100 mb-5">

        <div class="text-center mb-3">
            <div class="bg-light text-success rounded-circle d-inline-flex align-items-center justify-content-center shadow-sm mb-2" style="width: 50px; height: 50px; font-size: 22px;">
                🅿️
            </div>
            <h2 class="fw-bold mb-1 fs-3">Park a Vehicle</h2>
            <p class="text-muted small">Enter vehicle information</p>
        </div>

        <div class="alert alert-warning py-2 text-center" th:if="${message}" th:text="${message}"></div>

        <form th:action="@{/park}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small">Plate number</label>
                <input class="form-control bg-light border-0" type="text" name="plateNumber"
                       placeholder="e.g. CAB-1234" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small">Owner name</label>
                <input class="form-control bg-light border-0" type="text" name="ownerName"
                       placeholder="Owner name" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary small">Vehicle type</label>
                <select class="form-select bg-light border-0" name="type">
                    <option value="Car">Car</option>
                    <option value="Motorbike">Motorbike</option>
                </select>
            </div>
            <button class="btn btn-main w-100 fw-bold py-2 shadow-sm" type="submit">Confirm Parking</button>
        </form>

        <!-- Back to Home Button (Outline style, solid blue on hover) -->
        <div class="mt-4 text-center">
            <a th:href="@{/}" class="btn-back-home small">← Back to Home</a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
